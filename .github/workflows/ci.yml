name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic by construction: no test may depend on wall-clock time,
  # network access or an unseeded random number generator.
  CI: true

jobs:
  verify:
    name: Build, typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm coverage

      - name: Check every example compiles and runs
        run: pnpm examples

      - name: Check generated studio examples are current
        run: |
          node scripts/generate-studio-examples.mjs
          git diff --exit-code apps/studio/lib/examples.generated.ts

      - name: Build studio
        run: pnpm build:studio

      - name: Benchmark smoke test
        # Not a performance gate -- machines in CI vary too much for a
        # threshold to mean anything. This only proves the harness still runs.
        run: node --expose-gc scripts/benchmark.mjs --json > /dev/null

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  numpy-cross-check:
    name: Cross-check the simulator against NumPy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NumPy
        run: python -m pip install --no-cache-dir numpy

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Compare 22 circuits against NumPy
        run: pnpm verify:numpy

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
